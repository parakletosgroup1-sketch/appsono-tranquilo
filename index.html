<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noite Tranquila · Chef Nanna</title>
<meta name="description" content="Massagens do mundo todo, cantigas e técnicas para o sono do bebê.">
<meta name="theme-color" content="#121a31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noite Tranquila">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--acc-tx:#1f2b4d;--bg:#121a31;--bg2:#0d1428;--card:#1d2747;--card2:#26325a;--line:#2f3c68;--tx:#eef1fb;--tx2:#a9b3d6;--tx3:#7c87b0;--moon:#ffd36b;--moon2:#ffb84d;--rose:#ff8fab;--mint:#7fe0c3;--sky:#8ab4ff;--skin:#f6d2b8;--skin2:#e8b896;--shadow:0 6px 24px rgba(0,0,0,.35);--r:18px}
[data-theme=light]{--bg:#fbf7f0;--bg2:#f3ece0;--card:#fff;--card2:#f6f0e6;--line:#eadfcd;--tx:#1f2b4d;--tx2:#55607f;--tx3:#8a93ad;--moon:#2b6a58;--moon2:#e8590c;--rose:#e2557d;--mint:#16a34a;--sky:#3b6fd6;--acc-tx:#fff;--shadow:0 6px 20px rgba(31,43,77,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700}
h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 10px}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 20% 12%,#fff8,transparent),radial-gradient(1px 1px at 70% 8%,#fff9,transparent),radial-gradient(1.2px 1.2px at 85% 30%,#fff6,transparent),radial-gradient(1px 1px at 40% 25%,#fff7,transparent),radial-gradient(1.4px 1.4px at 10% 40%,#fff5,transparent),radial-gradient(1px 1px at 60% 45%,#fff5,transparent),radial-gradient(1px 1px at 92% 60%,#fff4,transparent)}
[data-theme=light] .stars{display:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
header.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header.top .brand b{font-size:17px;display:block}
header.top .brand small{display:block;color:var(--tx3);font-size:11px;margin-top:-2px}
.moonlogo{width:38px;height:38px;border-radius:12px;background:radial-gradient(circle at 35% 35%,#ffd36b,#ffb84d);display:grid;place-items:center;font-size:20px;box-shadow:0 0 18px #ffd36b55;flex:none}
.iconbtn{color:var(--tx);width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:19px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-weight:600;padding:6px 0;margin-bottom:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg2);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--tx3);font-size:10.5px;font-weight:600;padding:4px 0;border-radius:12px}
nav.tabs a span{display:block;font-size:22px;line-height:1.2;filter:grayscale(.6);opacity:.75}
nav.tabs a.on{color:var(--moon)}nav.tabs a.on span{filter:none;opacity:1}
.mini{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:39;display:none;justify-content:center;padding:0 12px}
.mini.show{display:flex}
.mini .in{width:100%;max-width:536px;background:var(--card2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:8px 10px}
.mini .eq{width:34px;height:34px;border-radius:10px;background:var(--moon);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:8px 7px;flex:none}
.mini .eq i{display:block;width:4px;background:var(--acc-tx);border-radius:2px;animation:eq 1s ease-in-out infinite}
.mini .eq i:nth-child(2){animation-delay:.2s}.mini .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:16px}}
.mini .txt{flex:1;min-width:0;font-size:13px;line-height:1.3}
.mini .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt small{color:var(--tx2)}
.mini button{width:36px;height:36px;border-radius:12px;background:var(--card);font-size:16px;flex:none}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.card.glow{background:linear-gradient(135deg,#2c3a72,#1d2747 60%);border-color:#3c4a85}
[data-theme=light] .card.glow{background:linear-gradient(135deg,#e6f2ec,#fff 65%);border-color:#cfe3d9}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:11.5px;color:var(--tx3)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h3{font-size:16px}.sec a{color:var(--moon);font-size:13px;font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--moon);color:var(--acc-tx);font-weight:700;border-radius:14px;padding:13px 18px;font-size:15px;text-decoration:none}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.rose{background:var(--rose);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--moon);color:var(--acc-tx);border-color:var(--moon)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.qa .e{font-size:26px}.qa b{font-size:14px;line-height:1.25}.qa small{color:var(--tx3);font-size:11.5px;line-height:1.3}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left;text-decoration:none;color:inherit}
.item .ic{width:50px;height:50px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;flex:none}
.item .bd{flex:1;min-width:0}.item .bd b{display:block;font-size:14.5px;line-height:1.3}.item .bd small{color:var(--tx2);font-size:12px}
.item .go{color:var(--tx3);font-size:18px}
.item.playing{border-color:var(--moon);box-shadow:0 0 0 1px var(--moon) inset}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--tx2);margin-right:4px}
.tag.y{background:#ffd36b26;color:var(--moon)}.tag.m{background:#7fe0c326;color:var(--mint)}.tag.r{background:#ff8fab26;color:var(--rose)}
.fav{font-size:20px;width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--card2);color:var(--moon);font-weight:700;font-size:13px;display:grid;place-items:center}
ul.bul{padding-left:20px;margin:6px 0}ul.bul li{margin:5px 0}
.warn{background:#ff8fab1a;border:1px solid #ff8fab55;border-radius:14px;padding:12px 14px;font-size:13px;color:var(--tx)}
.note{background:#ffd36b14;border:1px solid #ffd36b44;border-radius:14px;padding:12px 14px;font-size:13px}
.hero-ill{background:radial-gradient(circle at 50% 40%,#2e3d77,#1a2344 70%);border-radius:var(--r);display:flex;justify-content:center;padding:10px;margin-bottom:14px}
[data-theme=light] .hero-ill{background:radial-gradient(circle at 50% 40%,#fff6e6,#f3ebdf 70%)}
.hero-ill svg{width:180px;height:270px}
/* progresso do ritual */
.ring{width:64px;height:64px;flex:none}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--moon),var(--moon2));border-radius:99px;transition:width .4s}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.check:last-child{border:0}
.check .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:#fff;margin-top:1px}
.check.ok .bx{background:var(--mint);border-color:var(--mint)}
.check.ok b{text-decoration:line-through;opacity:.6}
.check .e{font-size:20px}
/* tabela */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t td{padding:9px 4px;border-bottom:1px dashed var(--line);vertical-align:top}table.t td:first-child{color:var(--moon);font-weight:700;width:64px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.kv b{display:block;font-size:13px;line-height:1.25}.kv small{font-size:10.5px;color:var(--tx3)}
/* player */
.player{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 30%,#24306a,#0b1022 75%);color:#eef1fb;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.player .ptop{width:100%;max-width:520px;display:flex;align-items:center;gap:10px}
.player .ptop .iconbtn{background:#ffffff14}
.player .pname{flex:1;text-align:center;font-size:13px;color:#a9b3d6}
.player .pbar{display:flex;gap:4px;width:100%;max-width:520px;margin:10px 0 4px}
.player .pbar i{flex:1;height:4px;border-radius:4px;background:#ffffff22;overflow:hidden}.player .pbar i b{display:block;height:100%;width:0;background:var(--moon)}
.player .ill{position:relative;margin:4px 0}
.player .ill svg{width:min(56vw,230px);height:auto;max-height:42vh}
.player .stitle{font-size:20px;font-weight:700;text-align:center;margin:6px 0 2px}
.player .rep{font-size:12px;color:var(--moon);font-weight:700;text-align:center;letter-spacing:.3px}
.player .sdesc{max-width:440px;text-align:center;color:#d5dbf2;font-size:15px;margin:8px 0 10px;min-height:66px}
.player .ctr{display:flex;align-items:center;gap:22px;margin:6px 0}
.player .ctr button{width:54px;height:54px;border-radius:50%;background:#ffffff14;font-size:20px;display:grid;place-items:center}
.player .ctr .pp{width:76px;height:76px;background:var(--moon);color:#1f2b4d;font-size:28px;position:relative}
.player .ctr .pp svg{position:absolute;inset:-6px;width:88px;height:88px;transform:rotate(-90deg)}
.player .time{font-variant-numeric:tabular-nums;color:#a9b3d6;font-size:13px;margin-top:4px}
.player .opts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.player .opts button{padding:8px 12px;border-radius:999px;background:#ffffff12;font-size:12.5px;font-weight:600;color:#cfd6f0}
.player .opts button.on{background:#ffd36b2a;color:var(--moon)}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:64px}
/* ilustração */
.baby .body{fill:var(--skin)}.baby .shade{fill:var(--skin2)}.baby .limb{stroke:var(--skin);stroke-linecap:round;fill:none}
.baby .face{stroke:#8a5a44;stroke-width:2;fill:none;stroke-linecap:round}
.baby .zone{fill:#ffd36b;opacity:.0}
.baby .zone.on{animation:zone 2.2s ease-in-out infinite}
.baby .zl.on{animation:zonel 2.2s ease-in-out infinite}
@keyframes zone{0%,100%{opacity:.25}50%{opacity:.55}}
@keyframes zonel{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.65}}
.baby .path{fill:none;stroke:#ffffff;stroke-opacity:.55;stroke-width:1.6;stroke-dasharray:4 4}
.baby .hand{fill:#ff8fab;stroke:#fff;stroke-width:2}
.baby .holdhand{fill:#ff8fab;opacity:.85;animation:hold 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hold{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* diário */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border-radius:18px;padding:18px 12px;text-align:center;font-weight:700;background:var(--card);border:1px solid var(--line)}
.bigbtn .e{font-size:32px;display:block}
.running{background:linear-gradient(135deg,#3a2f74,#1d2747);border:1px solid #5a4ea8;border-radius:18px;padding:18px;text-align:center}
[data-theme=light] .running{background:linear-gradient(135deg,#efe9ff,#fff);border-color:#d6ccff}
.running .clock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border:0}
.entry .e{font-size:22px}.entry .bd{flex:1}.entry .bd b{display:block;font-size:14px}.entry .del{color:var(--tx3);font-size:18px;padding:6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* sons */
.vol{display:flex;align-items:center;gap:10px;margin:8px 0}.vol span{width:96px;white-space:nowrap;flex:none;font-size:12.5px;color:var(--tx2)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--card2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--moon);margin-top:-8px;border:3px solid var(--bg)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--card2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--moon);border:3px solid var(--bg)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--moon);color:var(--acc-tx)}
/* luz noturna */
.nightlight{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#7a5a30}
.nightlight .glow{width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,#ff9a3c 0%,#ff7a1a55 35%,transparent 70%);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.04)}}
.nightlight .ctl{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:420px;margin:auto;text-align:center;font-size:12px}
.nightlight input[type=range]::-webkit-slider-runnable-track{background:#3a2a18}
.nightlight input[type=range]::-webkit-slider-thumb{background:#c47a2c;border-color:#000}
/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.onb .moonbig{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 35% 35%,#fff1c2,var(--moon) 45%,var(--moon2));box-shadow:0 0 60px #ffd36b66}
.onb h1{text-align:center;font-size:26px}
.onb p.lead{text-align:center;color:var(--tx2);margin:8px 0 22px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.switch{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.switch:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--tx3);transition:.2s}
.switch.on{background:var(--mint)}.switch.on:after{left:23px;background:#fff}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}.setrow:last-child{border:0}.setrow .bd{flex:1}.setrow .bd b{display:block;font-size:14.5px}.setrow .bd small{color:var(--tx3);font-size:12px}
.footer-note{font-size:11.5px;color:var(--tx3);text-align:center;margin:24px 8px 0;line-height:1.5}

/* álbum */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--card2);text-decoration:none;color:#fff}
.fcard img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .flab{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,#000b)}
.fcard .flab b{display:block;font-size:14px;line-height:1.2}.fcard .flab small{font-size:10.5px;opacity:.85}
.fmarco{position:absolute;top:8px;left:8px;right:8px;font-size:10px;font-weight:700;background:#ffd36be6;color:#1f2b4d;border-radius:99px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content;max-width:calc(100% - 16px)}
.fprev{position:relative;border-radius:var(--r);overflow:hidden;margin:8px 0 14px;background:var(--card2)}
.fprev img{width:100%;max-height:62vh;object-fit:contain;display:block}
.fbadge{position:absolute;right:10px;bottom:10px;background:#ffd36b;color:#1f2b4d;font-weight:700;font-size:13px;border-radius:99px;padding:5px 12px}
.fbadge.l{right:auto;left:10px;background:#fff;color:#1f2b4d}
.fstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fstrip a{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:block}
.fstrip img{width:100%;height:100%;object-fit:cover}
.fstrip span{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#fff;text-align:center;padding:10px 2px 3px;background:linear-gradient(transparent,#000a)}
.cmp{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#000;touch-action:none;user-select:none;margin:8px 0 4px}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .cA{position:absolute;inset:0}
.cline{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%);pointer-events:none}

const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dur = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? h + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min'; };
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function idadeMeses() { if (!S.perfil || !S.perfil.nasc) return null; const [y, m] = S.perfil.nasc.split('-').map(Number); const n = new Date(); return (n.getFullYear() - y) * 12 + (n.getMonth() + 1 - m); }
function idadeTxt() { const m = idadeMeses(); if (m == null) return ''; if (m < 1) return 'recém-nascido'; if (m < 24) return m + (m === 1 ? ' mês' : ' meses'); const a = Math.floor(m / 12), r = m % 12; return a + ' anos' + (r ? ' e ' + r + (r === 1 ? ' mês' : ' meses') : ''); }
function faixaId() { const m = idadeMeses(); if (m == null || m < 9) return '6-8'; if (m < 12) return '9-12'; if (m < 18) return '12-18'; return '18-24'; }
const nomeBebe = () => (S.perfil && S.perfil.nome) ? S.perfil.nome : 'seu bebê';
function saud() { const h = new Date().getHours(); return h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function diaDoAno() { const n = new Date(); return Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5); }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
const M = id => MASSAGENS.find(m => m.id === id);

/* ---------- ilustração do bebê ---------- */
function babySVG(passo, opts = {}) {
  const z = new Set(passo ? passo.z : []), back = passo && passo.back;
  const on = k => z.has(k) ? ' on' : '';
  const anim = opts.anim !== false;
  let paths = '', hands = '';
  if (passo && passo.p && passo.p.length && !passo.hold) {
    passo.p.forEach((d, i) => {
      paths += `<path class="path" d="${d}"/>`;
      if (anim) hands += `<circle class="hand" r="8"><animateMotion dur="${opts.dur || 3.2}s" repeatCount="indefinite" begin="${(i * .35).toFixed(2)}s" path="${d}" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/></circle>`;
    });
  }
  if (passo && passo.hold && passo.z.length) {
    const pos = { barriga: [100, 140], peito: [100, 108], cabeca: [100, 34], peD: [127, 276], peE: [73, 276], costas: [100, 130] };
    passo.z.forEach(k => { const p = pos[k]; if (p) hands += `<ellipse class="holdhand" cx="${p[0]}" cy="${p[1]}" rx="17" ry="12"/>`; });
  }
  const face = back
    ? `<path d="M76,40 Q100,22 124,40" stroke="#b07a55" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/><path d="M100,92 L100,176" stroke="#d9a785" stroke-width="2" stroke-dasharray="3 5"/>`
    : `<path class="face" d="M84,58 q6,4 12,0"/><path class="face" d="M104,58 q6,4 12,0"/><path class="face" d="M93,70 q7,5 14,0"/><circle cx="82" cy="66" r="5" fill="#ff8fab" opacity=".45"/><circle cx="118" cy="66" r="5" fill="#ff8fab" opacity=".45"/><path d="M92,28 q8,-8 14,0" stroke="#b07a55" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<svg class="baby" viewBox="0 0 200 300" role="img" aria-label="Ilustração do bebê com a área da massagem destacada">
   <line class="limb" x1="117" y1="178" x2="125" y2="264" stroke-width="22"/><line class="limb" x1="83" y1="178" x2="75" y2="264" stroke-width="22"/>
   <ellipse class="body" cx="128" cy="276" rx="10" ry="13"/><ellipse class="body" cx="72" cy="276" rx="10" ry="13"/>
   <line class="limb" x1="132" y1="98" x2="164" y2="168" stroke-width="17"/><line class="limb" x1="68" y1="98" x2="36" y2="168" stroke-width="17"/>
   <circle class="body" cx="167" cy="176" r="10"/><circle class="body" cx="33" cy="176" r="10"/>
   <path class="body" d="M70,94 Q100,80 130,94 L134,168 Q100,194 66,168 Z"/>
   <path d="M68,162 Q100,186 132,162 L130,184 Q100,200 70,184 Z" fill="#ffffff" opacity=".92"/>
   <rect class="body" x="90" y="76" width="20" height="14" rx="6"/>
   <circle class="body" cx="100" cy="55" r="30"/>
   ${face}
   <ellipse class="zone${on('rosto')}" cx="100" cy="64" rx="22" ry="14"/>
   <ellipse class="zone${on('testa')}" cx="100" cy="42" rx="24" ry="11"/>
   <circle class="zone${on('cabeca')}" cx="100" cy="50" r="33"/>
   <ellipse class="zone${on('peito')}" cx="100" cy="108" rx="29" ry="15"/>
   <ellipse class="zone${on('barriga')}" cx="100" cy="142" rx="27" ry="22"/>
   <path class="zone${on('costas')}" d="M70,94 Q100,80 130,94 L134,168 Q100,194 66,168 Z"/>
   <line class="zl${on('bracoD')}" x1="132" y1="98" x2="164" y2="168" stroke="#ffd36b" stroke-opacity="0" stroke-width="22" stroke-linecap="round"/>
   <line class="zl${on('bracoE')}" x1="68" y1="98" x2="36" y2="168" stroke="#ffd36b" stroke-opacity="0" stroke-width="22" stroke-linecap="round"/>
   <line class="zl${on('pernaD')}" x1="117" y1="178" x2="125" y2="264" stroke="#ffd36b" stroke-opacity="0" stroke-width="26" stroke-linecap="round"/>
   <line class="zl${on('pernaE')}" x1="83" y1="178" x2="75" y2="264" stroke="#ffd36b" stroke-opacity="0" stroke-width="26" stroke-linecap="round"/>
   <circle class="zone${on('maoD')}" cx="167" cy="176" r="14"/><circle class="zone${on('maoE')}" cx="33" cy="176" r="14"/>
   <ellipse class="zone${on('peD')}" cx="128" cy="276" rx="14" ry="17"/><ellipse class="zone${on('peE')}" cx="72" cy="276" rx="14" ry="17"/>
   ${paths}${hands}
  </svg>`;
}

/* ---------- roteamento ---------- */
const routes = {};
function go(h) { location.hash = h; }
function render() {
  const h = location.hash.slice(1) || 'inicio';
  const [name, arg] = h.split('/');
  if (!S.perfil && name !== 'onboarding') { renderOnboarding(); return; }
  const fn = routes[name] || routes.inicio;
  const tab = { inicio: 'inicio', massagens: 'massagens', massagem: 'massagens', ninar: 'ninar', rotina: 'rotina', tecnicas: 'rotina', tecnica: 'rotina', diario: 'diario', novo: 'diario', album: 'album', foto: 'album', novafoto: 'album', antesdepois: 'album', evolucao: 'album' }[name] || 'mais';
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  $('nav.tabs').style.display = ''; $('header.top').style.display = '';
  $('#view').innerHTML = `<div class="fade">${fn(arg ? decodeURIComponent(arg) : '')}</div>`;
  if (fn.after) fn.after(arg);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ---------- onboarding ---------- */
function renderOnboarding() {
  $('nav.tabs').style.display = 'none'; $('header.top').style.display = 'none';
  const n = new Date(), max = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  $('#view').innerHTML = `<div class="onb fade">
    <div class="moonbig"></div>
    <h1>Noite Tranquila</h1>
    <p class="lead">Massagens do mundo todo, cantigas e técnicas de sono para noites mais calmas na sua casa.</p>
    <div class="card">
      <label class="f" for="onome">Como o seu bebê se chama?</label>
      <input id="onome" placeholder="Ex.: Alice" maxlength="24" autocomplete="off">
      <label class="f" for="onasc">Mês e ano em que nasceu</label>
      <input id="onasc" type="month" max="${max}">
      <p class="tiny" style="margin-top:8px">Usamos a idade para sugerir a rotina e as massagens certas. Fica salvo só no seu celular.</p>
      <button class="btn block" id="ogo" style="margin-top:14px">Começar 🌙</button>
    </div>
    <button class="muted small" id="oskip" style="margin:6px auto">Pular por enquanto</button>
  </div>`;
  $('#ogo').onclick = () => { S.perfil = { nome: $('#onome').value.trim(), nasc: $('#onasc').value }; save('perfil'); go('inicio'); render(); };
  $('#oskip').onclick = () => { S.perfil = { nome: '', nasc: '' }; save('perfil'); go('inicio'); render(); };
}

/* ---------- INÍCIO ---------- */
routes.inicio = () => {
  const k = hoje(), feitos = (S.ritual[k] || []).length, pct = Math.round(feitos / RITUAL.length * 100);
  const tec = TECNICAS[diaDoAno() % TECNICAS.length], mas = MASSAGENS[(diaDoAno() * 7) % MASSAGENS.length];
  const ultimo = [...S.diario].filter(e => e.fim).sort((a, b) => b.fim - a.fim)[0];
  const fx = IDADES.find(i => i.id === faixaId());
  let sug = '';
  if (S.dormindo) sug = `<b>${esc(nomeBebe())} está dormindo</b> desde as ${hhmm(S.dormindo.ini)} (${S.dormindo.tipo}).`;
  else if (ultimo && Date.now() - ultimo.fim < 8 * 3600e3 && idadeMeses() != null && new Date().getHours() >= 6 && new Date().getHours() < 18) {
    const jan = { '6-8': [120, 180], '9-12': [150, 210], '12-18': [180, 300], '18-24': [300, 360] }[faixaId()];
    sug = `Acordou às <b>${hhmm(ultimo.fim)}</b>. Pela idade, o próximo sono deve vir entre <b>${hhmm(ultimo.fim + jan[0] * 6e4)}</b> e <b>${hhmm(ultimo.fim + jan[1] * 6e4)}</b>. Fique de olho nos sinais de sono.`;
  }
  const r = 26, c = 2 * Math.PI * r;
  return `
  <div style="margin:6px 0 14px"><div class="muted small">${saud()}, mamãe 🌙</div>
  <h1>Vamos preparar uma noite tranquila?</h1>${idadeTxt() ? `<div class="tiny" style="margin-top:4px">${esc(nomeBebe())} · ${idadeTxt()}</div>` : ''}</div>

  <a class="card glow row" href="#ritual" style="text-decoration:none;color:inherit">
    <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" stroke="var(--card2)" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="${r}" stroke="var(--moon)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">${feitos}/${RITUAL.length}</text></svg>
    <div style="flex:1"><h3>Ritual de hoje</h3><div class="small muted">${pct === 100 ? 'Ritual completo! Boa noite 💛' : feitos ? 'Continue de onde parou.' : '8 passos para o corpo entender que é hora de dormir.'}</div></div><span class="go">›</span>
  </a>

  ${sug ? `<div class="note" style="margin-bottom:14px">⏰ ${sug}</div>` : ''}

  <div id="homeFoto"></div>
  <div class="grid2">
    <button class="qa" onclick="startRotina('noite')"><span class="e">👐</span><b>Massagem da noite</b><small>10 min guiados, passo a passo</small></button>
    <button class="qa" onclick="abaNinar='cantigas';go('ninar')"><span class="e">🎶</span><b>Cantigas de ninar</b><small>${CANTIGAS.length} cantigas em caixinha de música</small></button>
    <button class="qa" onclick="abaNinar='sons';go('ninar')"><span class="e">🌊</span><b>Sons para dormir</b><small>${SONS.length} sons: chuva, mar, coração...</small></button>
    <button class="qa" onclick="go('luz')"><span class="e">🕯️</span><b>Luz noturna</b><small>Para a mamada da madrugada</small></button>
  </div>

  <div class="sec"><h3>Massagem do dia</h3><a href="#massagens">Ver todas</a></div>
  ${massItem(mas)}

  <div class="sec"><h3>Técnica do dia</h3><a href="#tecnicas">Ver as 20</a></div>
  <a class="item" href="#tecnica/${tec.id}"><div class="ic">${tec.flag}</div><div class="bd"><b>${esc(tec.nome)}</b><small>${esc(tec.pais)} · ${esc(tec.idade)}</small></div><span class="go">›</span></a>

  <div class="sec"><h3>Rotinas rápidas</h3></div>
  ${ROTINAS.map(r => `<button class="item" onclick="startRotina('${r.id}')"><div class="ic">${r.emoji}</div><div class="bd"><b>${esc(r.nome)}</b><small>${r.min} min · ${esc(r.desc)}</small></div><span class="go">▶</span></button>`).join('')}

  <div class="sec"><h3>Para esta idade</h3><a href="#rotina">Rotina completa</a></div>
  <div class="card"><div class="kv" style="margin:0"><div><b>${fx.total.replace(' por dia', '')}</b><small>sono por dia</small></div><div><b>${fx.sonecas}</b><small>sonecas</small></div><div><b>${fx.janela.split(' acordado')[0]}</b><small>acordado</small></div></div></div>
  <p class="footer-note">${AVISO}</p>`;
};

function massItem(m) {
  const fav = S.favs.includes(m.id);
  return `<a class="item" href="#massagem/${m.id}"><div class="ic">${m.flag}</div><div class="bd"><b>${esc(m.nome)}${fav ? ' 💛' : ''}</b><small>${esc(m.pais)} · ${m.min} min · ${esc(m.idade)}</small><div style="margin-top:4px"><span class="tag y">${esc(m.tag)}</span></div></div><span class="go">›</span></a>`;
}

/* ---------- MASSAGENS ---------- */
let filtroM = 'todas';
routes.massagens = () => {
  const filtros = [['todas', 'Todas'], ['fav', '💛 Favoritas'], ['gases', 'Gases e cólica'], ['dormir', 'Antes de dormir'], ['bebe', 'Recém-nascido'], ['rapida', 'Até 3 min']];
  let lista = MASSAGENS;
  if (filtroM === 'fav') lista = lista.filter(m => S.favs.includes(m.id));
  if (filtroM === 'gases') lista = lista.filter(m => /Gases|cólica|digest/i.test(m.tag));
  if (filtroM === 'dormir') lista = lista.filter(m => /dormir|berço|noite|Relaxar|Rotina|Clássica|leve|pesquisa|cantiga/i.test(m.tag));
  if (filtroM === 'bebe') lista = lista.filter(m => /nascimento|1 mês/.test(m.idade));
  if (filtroM === 'rapida') lista = lista.filter(m => m.min <= 3);
  return `<h1 style="margin:6px 0 4px">Massagens</h1><p class="muted small">15 massagens de 9 países, com passo a passo animado e voz guia.</p>
  <div class="chips">${filtros.map(([k, l]) => `<button class="chip${filtroM === k ? ' on' : ''}" onclick="filtroM='${k}';render()">${l}</button>`).join('')}</div>
  ${filtroM === 'todas' ? `<div class="sec" style="margin-top:6px"><h3>Rotinas guiadas</h3></div>
  ${ROTINAS.map(r => `<button class="item" onclick="startRotina('${r.id}')"><div class="ic">${r.emoji}</div><div class="bd"><b>${esc(r.nome)}</b><small>${r.min} min · ${esc(r.desc)}</small></div><span class="go">▶</span></button>`).join('')}
  <div class="sec"><h3>Todas as massagens</h3></div>` : ''}
  ${lista.length ? lista.map(massItem).join('') : `<div class="card muted small">Nenhuma massagem aqui ainda. Toque no 💛 dentro de uma massagem para salvar nas favoritas.</div>`}
  <a class="item" href="#seguranca"><div class="ic">🛡️</div><div class="bd"><b>Antes de começar: segurança</b><small>Óleo, horário, quando não fazer</small></div><span class="go">›</span></a>`;
};

routes.massagem = id => {
  const m = M(id); if (!m) return routes.massagens();
  const fav = S.favs.includes(m.id);
  return `<button class="back" onclick="history.back()">‹ Voltar</button>
  <div class="row between" style="align-items:flex-start"><div><div class="tiny">${m.flag} ${esc(m.pais)}</div><h1>${esc(m.nome)}</h1></div>
  <button class="fav" onclick="toggleFav('${m.id}')" aria-label="Favoritar">${fav ? '💛' : '🤍'}</button></div>
  <div style="margin:8px 0 14px"><span class="tag y">${esc(m.tag)}</span><span class="tag">⏱ ${m.min} min</span><span class="tag m">${esc(m.idade)}</span></div>
  <div class="hero-ill">${babySVG(m.passos.find(p => p.p.length) || m.passos[0])}</div>
  <p>${esc(m.intro)}</p>
  <button class="btn block" onclick="startMassagem('${m.id}')" style="margin:12px 0 18px">▶ Começar massagem guiada</button>
  <div class="card"><h3 style="margin-bottom:6px">Passo a passo</h3><ol class="steps">${m.passos.map(p => `<li><b>${esc(p.t)}</b>${p.rep ? ` <span class="tiny">· ${esc(p.rep)}</span>` : ''}<div class="small muted">${esc(p.d)}</div></li>`).join('')}</ol></div>
  <div class="warn">⚠️ Óleo vegetal neutro, mãos mornas, 30 a 45 min depois de mamar. Se o bebê chorar ou virar o rosto, pare. <a href="#seguranca" style="color:var(--rose);font-weight:600">Ver cuidados</a></div>`;
};
function toggleFav(id) { const i = S.favs.indexOf(id); i < 0 ? S.favs.push(id) : S.favs.splice(i, 1); save('favs'); toast(i < 0 ? 'Salva nas favoritas 💛' : 'Removida das favoritas'); render(); }

/* ---------- PLAYER GUIADO ---------- */
const PL = { seq: [], i: 0, left: 0, playing: false, iv: null, nome: '', wake: null, music: false };
function startMassagem(id) { const m = M(id); openPlayer(m.nome, m.passos.map(p => ({ m, p })), null); }
function startRotina(id) { const r = ROTINAS.find(x => x.id === id); openPlayer(r.nome, r.itens.map(([mid, i]) => ({ m: M(mid), p: M(mid).passos[i] })), r.som); }
async function wakeOn() { try { if ('wakeLock' in navigator) PL.wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
function wakeOff() { try { PL.wake && PL.wake.release(); } catch (e) {} PL.wake = null; }
function openPlayer(nome, seq, som) {
  Audio2.init();
  Object.assign(PL, { seq, i: 0, nome, playing: true, music: S.prefs.musica });
  const pl = document.createElement('div'); pl.className = 'player'; pl.id = 'player'; document.body.appendChild(pl);
  document.body.style.overflow = 'hidden';
  if (PL.music) { const cid = (som && CANTIGAS.find(c => c.id === som)) ? som : S.prefs.cantigaMassagem; if (Audio2.st.cantiga !== cid && som !== 'shhh') Audio2.playCantiga(cid); if (som === 'shhh' && !Audio2.st.som) Audio2.playSom('shhh'); }
  wakeOn(); loadStep(); clearInterval(PL.iv); PL.iv = setInterval(tick, 1000);
}
function loadStep() { PL.left = PL.seq[PL.i].p.s; drawPlayer(); speak(); }
function speak() {
  if (!S.prefs.voz || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const { p } = PL.seq[PL.i]; const u = new SpeechSynthesisUtterance(p.t + '. ' + p.d + (p.rep ? ' Repita: ' + p.rep + '.' : ''));
    u.lang = 'pt-BR'; u.rate = .92; u.pitch = 1.05; const v = speechSynthesis.getVoices().find(v => /pt.BR/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {}
}
function tick() {
  if (!PL.playing || !$('#player')) return;
  PL.left--; if (PL.left <= 0) { Audio2.chime(); if (PL.i < PL.seq.length - 1) { PL.i++; loadStep(); } else finishPlayer(); return; }
  const tot = PL.seq[PL.i].p.s, c = 2 * Math.PI * 41;
  const ring = $('#pring'); if (ring) ring.setAttribute('stroke-dashoffset', c * (PL.left / tot));
  const t = $('#ptime'); if (t) t.textContent = mmss(PL.left) + ' neste passo · ' + mmss(PL.seq.slice(PL.i + 1).reduce((a, x) => a + x.p.s, PL.left)) + ' no total';
  const b = $('#pbarcur'); if (b) b.style.width = (100 * (1 - PL.left / tot)) + '%';
}
function drawPlayer() {
  const { m, p } = PL.seq[PL.i], c = 2 * Math.PI * 41, n = PL.seq.length;
  $('#player').innerHTML = `
   <div class="ptop"><button class="iconbtn" onclick="closePlayer()" aria-label="Fechar">✕</button><div class="pname">${esc(PL.nome)} · passo ${PL.i + 1} de ${n}</div><button class="iconbtn" onclick="go('luz');closePlayer(true)" aria-label="Luz noturna">🕯️</button></div>
   <div class="pbar">${PL.seq.map((_, k) => `<i><b ${k === PL.i ? 'id="pbarcur"' : ''} style="width:${k < PL.i ? 100 : 0}%"></b></i>`).join('')}</div>
   <div class="tiny" style="color:#a9b3d6;margin-top:4px">${m.flag} ${esc(m.nome)}</div>
   <div class="ill">${babySVG(p)}</div>
   <div class="stitle">${esc(p.t)}</div>${p.rep ? `<div class="rep">${esc(p.rep.toUpperCase())}</div>` : ''}
   <div class="sdesc">${esc(p.d)}</div>
   <div class="ctr"><button onclick="stepGo(-1)" aria-label="Anterior">⏮</button>
     <button class="pp" onclick="togglePlay()" aria-label="Pausar">${PL.playing ? '❚❚' : '▶'}<svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="41" stroke="#ffffff22" stroke-width="4" fill="none"/><circle id="pring" cx="44" cy="44" r="41" stroke="#ffd36b" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (PL.left / p.s)}"/></svg></button>
     <button onclick="stepGo(1)" aria-label="Próximo">⏭</button></div>
   <div class="time" id="ptime">${mmss(PL.left)} neste passo</div>
   <div class="opts"><button class="${S.prefs.voz ? 'on' : ''}" onclick="togVoz()">🗣️ Voz guia</button><button class="${Audio2.st.cantiga ? 'on' : ''}" onclick="togMusicaPl()">🎶 Cantiga</button><button onclick="PL.left+=30;tick();PL.left++">+30s</button></div>`;
}
function stepGo(d) { const ni = PL.i + d; if (ni < 0) return; if (ni >= PL.seq.length) { finishPlayer(); return; } PL.i = ni; loadStep(); }
function togglePlay() { PL.playing = !PL.playing; if (!PL.playing) try { speechSynthesis.cancel(); } catch (e) {} drawPlayer(); }
function togVoz() { S.prefs.voz = !S.prefs.voz; save('prefs'); if (S.prefs.voz) speak(); else try { speechSynthesis.cancel(); } catch (e) {} drawPlayer(); toast(S.prefs.voz ? 'Voz guia ligada' : 'Voz guia desligada'); }
function togMusicaPl() { if (Audio2.st.cantiga) Audio2.stopCantiga(); else Audio2.playCantiga(S.prefs.cantigaMassagem); drawPlayer(); }
function finishPlayer() {
  clearInterval(PL.iv); try { speechSynthesis.cancel(); } catch (e) {}

/* ---------- DIÁRIO ---------- */
function iniciarSono(tipo) { S.dormindo = { tipo, ini: Date.now(), acordou: [] }; save('dormindo'); toast(tipo === 'noite' ? 'Boa noite! 🌙 Registrando o sono' : 'Soneca registrada 😴'); }
function acordouAgora() { if (!S.dormindo) return; S.diario.push({ id: Date.now(), ...S.dormindo, fim: Date.now() }); S.dormindo = null; save('dormindo'); save('diario'); toast('Registrado no diário'); render(); }
function despertar() { if (!S.dormindo) return; S.dormindo.acordou.push(Date.now()); save('dormindo'); toast('Despertar anotado. Volte a dormir, mamãe 💛'); render(); }
function delEntry(id) { if (!confirmar()) return; S.diario = S.diario.filter(e => e.id !== id); save('diario'); render(); }
function confirmar() { return true; }
let diarioIv = null;
routes.diario = () => {
  const d = S.dormindo;
  const ent = [...S.diario].sort((a, b) => b.ini - a.ini);
  // últimos 7 dias
  const dias = []; for (let i = 6; i >= 0; i--) { const dt = new Date(); dt.setHours(0, 0, 0, 0); dt.setDate(dt.getDate() - i); dias.push(dt); }
  const tot = dias.map(dt => { const k = hoje(dt); let sn = 0, nt = 0, ac = 0; S.diario.forEach(e => { if (hoje(new Date(e.ini)) === k) { const ms = e.fim - e.ini; e.tipo === 'noite' ? (nt += ms, ac += (e.acordou || []).length) : sn += ms; } }); return { k, dt, sn: sn / 36e5, nt: nt / 36e5, ac }; });
  const mx = Math.max(14, ...tot.map(t => t.sn + t.nt)), W = 320, H = 150, bw = 28, gap = (W - 20 - bw * 7) / 6;
  const bars = tot.map((t, i) => { const x = 20 + i * (bw + gap), hn = t.nt / mx * (H - 30), hs = t.sn / mx * (H - 30), y0 = H - 18;
    return `<rect x="${x}" y="${y0 - hn}" width="${bw}" height="${hn}" rx="4" fill="#8ab4ff"/><rect x="${x}" y="${y0 - hn - hs - (hs ? 2 : 0)}" width="${bw}" height="${hs}" rx="4" fill="#ffd36b"/>
    ${t.sn + t.nt ? `<text x="${x + bw / 2}" y="${y0 - hn - hs - 6}" text-anchor="middle" font-size="9" fill="var(--tx2)">${(t.sn + t.nt).toFixed(1)}h</text>` : ''}
    <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--tx3)">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][t.dt.getDay()]}</text>`; }).join('');
  const comDados = tot.filter(t => t.sn + t.nt > 0);
  const media = comDados.length ? (comDados.reduce((a, t) => a + t.sn + t.nt, 0) / comDados.length) : 0;
  const mediaAc = comDados.length ? (comDados.reduce((a, t) => a + t.ac, 0) / comDados.length) : 0;
  return `<h1 style="margin:6px 0 4px">Diário do sono</h1><p class="muted small">Anote sonecas e noites com um toque. Em poucos dias você enxerga o padrão d${S.perfil.nome ? 'e ' + esc(S.perfil.nome) : 'o bebê'}.</p>
  ${d ? `<div class="running"><div class="small">${d.tipo === 'noite' ? '🌙 Sono da noite' : '😴 Soneca'} desde ${hhmm(d.ini)}</div><div class="clock" id="dclock">${mmss((Date.now() - d.ini) / 1000)}</div>
     ${d.tipo === 'noite' ? `<div class="small muted">${d.acordou.length} despertar${d.acordou.length === 1 ? '' : 'es'} na madrugada</div>` : ''}
     <div class="row" style="justify-content:center;margin-top:12px;gap:8px"><button class="btn" onclick="acordouAgora()">☀️ Acordou</button>${d.tipo === 'noite' ? `<button class="btn ghost" onclick="despertar()">+ Despertou e voltou</button>` : ''}</div>
     <button class="tiny" style="margin-top:10px" onclick="S.dormindo=null;save('dormindo');render()">Cancelar registro</button></div>`
  : `<div class="bigbtns"><button class="bigbtn" onclick="iniciarSono('soneca');render()"><span class="e">😴</span>Começou a soneca</button><button class="bigbtn" onclick="iniciarSono('noite');render()"><span class="e">🌙</span>Dormiu para a noite</button></div>`}
  <button class="btn ghost block" style="margin:12px 0" onclick="go('novo')">✏️ Anotar um sono que já passou</button>
  <div class="card chart"><div class="row between"><h4>Últimos 7 dias</h4><span class="tiny">${comDados.length ? 'média ' + media.toFixed(1) + 'h/dia' : ''}</span></div>
    <svg viewBox="0 0 ${W} ${H}">${bars}</svg>
    <div class="legend"><span><i style="background:#8ab4ff"></i>Noite</span><span><i style="background:#ffd36b"></i>Sonecas</span>${comDados.length ? `<span>${mediaAc.toFixed(1)} despertares/noite</span>` : ''}</div>
    ${!comDados.length ? '<p class="tiny" style="margin-top:8px">O gráfico aparece assim que você registrar o primeiro sono.</p>' : `<p class="tiny" style="margin-top:8px">Referência para ${IDADES.find(i => i.id === faixaId()).nome}: ${IDADES.find(i => i.id === faixaId()).total}.</p>`}
  </div>
  <div class="card"><h4 style="margin-bottom:4px">Registros</h4>
  ${ent.length ? ent.slice(0, 30).map(e => `<div class="entry"><span class="e">${e.tipo === 'noite' ? '🌙' : '😴'}</span><div class="bd"><b>${e.tipo === 'noite' ? 'Noite' : 'Soneca'} · ${dur(e.fim - e.ini)}</b><small class="muted">${new Date(e.ini).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' })} · ${hhmm(e.ini)} às ${hhmm(e.fim)}${(e.acordou || []).length ? ' · ' + e.acordou.length + ' despertar(es)' : ''}${e.nota ? ' · ' + esc(e.nota) : ''}</small></div><button class="del" onclick="delEntry(${e.id})" aria-label="Apagar">🗑</button></div>`).join('') : '<p class="small muted">Nenhum registro ainda.</p>'}</div>`;
};

function salvarNovo() {
  const d = $('#nd').value, i = $('#ni').value, f = $('#nf').value; if (!d || !i || !f) return toast('Preencha dia e horários');

/* ================= ÁLBUM DE EVOLUÇÃO (fotos semanais) =================
   As fotos ficam no IndexedDB do próprio celular (não vão para nenhum servidor). */
const FotoDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('noite_tranquila', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('fotos', mode), s = t.objectStore('fotos'); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); };
  return {
    add: rec => tx('readwrite', s => s.put(rec)),
    del: id => tx('readwrite', s => s.delete(id)),
    all: async () => { try { const r = await tx('readonly', s => s.getAll()); return (r || []).sort((a, b) => a.ts - b.ts); } catch (e) { return []; } }
  };
})();

const MARCOS = ['', 'Primeiro sorriso', 'Sustentou a cabeça', 'Rolou sozinho', 'Sentou sem apoio', 'Primeira papinha', 'Primeiro dentinho', 'Engatinhou', 'Ficou em pé', 'Primeiros passos', 'Primeira palavra', 'Dormiu a noite toda', 'Mesversário', 'Outro momento especial'];

const limparURLs = () => { fotoURLs.forEach(u => URL.revokeObjectURL(u)); fotoURLs = []; };

function nascDate() { if (!S.perfil || !S.perfil.nasc) return null; const p = S.perfil.nasc.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
function idadeNaFoto(ts) {
  const n = nascDate(); if (!n) return { curto: new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }), sem: null };
  const dias = Math.max(0, Math.floor((ts - n) / 864e5)), sem = Math.floor(dias / 7) + 1;
  const d = new Date(ts); let m = (d.getFullYear() - n.getFullYear()) * 12 + d.getMonth() - n.getMonth(); if (d.getDate() < n.getDate()) m--; m = Math.max(0, m);
  const anv = new Date(n.getFullYear(), n.getMonth() + m, n.getDate()), ws = Math.max(0, Math.floor((ts - anv) / (7 * 864e5)));
  let curto; if (m < 1) curto = 'Semana ' + sem; else if (m < 24) curto = m + (m === 1 ? ' mês' : ' meses') + (ws ? ' e ' + ws + ' sem' : ''); else { const a = Math.floor(m / 12), r = m % 12; curto = a + (a === 1 ? ' ano' : ' anos') + (r ? ' e ' + r + 'm' : ''); }
  return { curto, sem };
}
const dataBR = ts => new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

/* reduz a foto (mais leve e sem estourar a memória do celular) */
async function reduzir(file, max = 1280) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .86));
}

/* sono médio na semana da foto (liga o álbum ao diário) */
function sonoSemana(ts) {
  const ini = ts - 7 * 864e5, es = S.diario.filter(e => e.ini >= ini && e.ini <= ts + 864e5);
  if (!es.length) return null;
  const dias = new Set(es.map(e => hoje(new Date(e.ini)))).size;
  const noites = es.filter(e => e.tipo === 'noite');
  return { h: es.reduce((a, e) => a + (e.fim - e.ini), 0) / 36e5 / dias, desp: noites.length ? noites.reduce((a, e) => a + (e.acordou || []).length, 0) / noites.length : null };
}

routes.evolucao = () => `<div id="evoView"></div>`;
routes.evolucao.after = async () => {
  limparURLs(); const fotos = await FotoDB.all(); if (fotos.length < 2) { go('album'); return; }
  const urls = fotos.map(urlDe);
  const pl = document.createElement('div'); pl.className = 'player evo'; pl.id = 'evo';
  pl.innerHTML = `<div class="ptop"><button class="iconbtn" id="evoX" aria-label="Fechar">✕</button><div class="pname">A evolução de ${esc(nomeBebe())}</div><button class="iconbtn" id="evoM" aria-label="Música">🎶</button></div>
   <div class="pbar">${fotos.map(() => '<i><b></b></i>').join('')}</div>
   <div class="evoStage"><img id="e0"><img id="e1"></div>
   <div class="stitle" id="eLab"></div><div class="rep" id="eMar"></div><div class="time" id="eData"></div>
   <div class="ctr"><button id="evoP" aria-label="Anterior">⏮</button><button class="pp" id="evoPP" aria-label="Pausar">❚❚</button><button id="evoN" aria-label="Próxima">⏭</button></div>`;
  document.body.appendChild(pl); document.body.style.overflow = 'hidden';
  let i = -1, playing = true, layer = 0;
  const show = k => { i = (k + fotos.length) % fotos.length; layer ^= 1; const im = $('#e' + layer), ot = $('#e' + (layer ^ 1));
    im.src = urls[i]; im.classList.add('on'); ot.classList.remove('on');
    const a = idadeNaFoto(fotos[i].ts); $('#eLab').textContent = a.curto; $('#eMar').textContent = fotos[i].marco ? '⭐ ' + fotos[i].marco.toUpperCase() : ''; $('#eData').textContent = dataBR(fotos[i].ts);
    pl.querySelectorAll('.pbar b').forEach((b, j) => b.style.width = j <= i ? '100%' : '0'); };
  const loop = () => { clearInterval(evoIv); evoIv = setInterval(() => { if (playing) show(i + 1); }, 2200); };
  show(0); loop();
  if (!Audio2.st.cantiga) Audio2.playCantiga('brilha');
  $('#evoX').onclick = () => { clearInterval(evoIv); pl.remove(); document.body.style.overflow = ''; go('album'); };
  $('#evoM').onclick = () => { Audio2.st.cantiga ? Audio2.stopCantiga() : Audio2.playCantiga('brilha'); };
  $('#evoPP').onclick = e => { playing = !playing; e.currentTarget.firstChild.textContent = playing ? '❚❚' : '▶'; };
  $('#evoN').onclick = () => { show(i + 1); loop(); }; $('#evoP').onclick = () => { show(i - 1); loop(); };
};

/* ---------- montagem para compartilhar ---------- */
async function gerarMontagem() {
  const fotos = await FotoDB.all(); if (fotos.length < 2) return;
  toast('Criando a montagem...');
  const n = Math.min(9, fotos.length), sel = [];
  for (let k = 0; k < n; k++) sel.push(fotos[Math.round(k * (fotos.length - 1) / (n - 1))]);
  const cols = n <= 2 ? 2 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
  const W = 1080, pad = 36, top = 190, bot = 110, cell = (W - pad * (cols + 1)) / cols, H = top + rows * cell + (rows - 1) * pad + bot + pad;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#1d2a5c'); grd.addColorStop(1, '#121a31'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = '#ffffff22'; for (let s = 0; s < 60; s++) { g.beginPath(); g.arc((s * 197) % W, (s * 113) % H, (s % 3) + 1, 0, 7); g.fill(); }
  const F = 'Poppins, system-ui, sans-serif';
  g.fillStyle = '#ffd36b'; g.font = `700 64px ${F}`; g.textAlign = 'center'; g.fillText(S.perfil.nome ? 'A evolução de ' + S.perfil.nome : 'A evolução do meu bebê', W / 2, 105);
  g.fillStyle = '#c9d0ea'; g.font = `400 32px ${F}`; g.fillText(idadeNaFoto(sel[0].ts).curto + '  →  ' + idadeNaFoto(sel[n - 1].ts).curto, W / 2, 152);
  for (let k = 0; k < n; k++) {
    const f = sel[k], x = pad + (k % cols) * (cell + pad), y = top + Math.floor(k / cols) * (cell + pad);
    const bmp = await createImageBitmap(f.blob), s = Math.max(cell / bmp.width, cell / bmp.height), w = bmp.width * s, h = bmp.height * s;
    g.save(); g.beginPath(); g.roundRect ? g.roundRect(x, y, cell, cell, 28) : g.rect(x, y, cell, cell); g.clip();
    g.drawImage(bmp, x + (cell - w) / 2, y + (cell - h) / 2, w, h);
    const lg = g.createLinearGradient(0, y + cell * .6, 0, y + cell); lg.addColorStop(0, '#0000'); lg.addColorStop(1, '#000a'); g.fillStyle = lg; g.fillRect(x, y, cell, cell); g.restore();
    g.fillStyle = '#fff'; g.font = `700 ${cols === 3 ? 34 : 46}px ${F}`; g.textAlign = 'left'; g.fillText(idadeNaFoto(f.ts).curto, x + 22, y + cell - 24);
  }
  g.fillStyle = '#a9b3d6'; g.font = `600 28px ${F}`; g.textAlign = 'center'; g.fillText('🌙 Noite Tranquila · Chef Nanna', W / 2, H - 50);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9)), nome = 'evolucao_' + (S.perfil.nome || 'bebe').replace(/\W+/g, '_') + '.jpg';
  const file = new File([blob], nome, { type: 'image/jpeg' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'A evolução de ' + nomeBebe() }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  baixarBlob(blob, nome); toast('Montagem salva nos downloads 🖼️');
}

/* ---------- lembrete na tela inicial ---------- */
routes.inicio.after = async () => {
  const box = $('#homeFoto'); if (!box) return;
  const fotos = await FotoDB.all(), ult = fotos[fotos.length - 1];
  if (!ult || Date.now() - ult.ts > 6.5 * 864e5) {
    box.innerHTML = `<a class="card row" href="#album" style="text-decoration:none;color:inherit;border-color:#ff8fab66"><div style="font-size:30px">📸</div><div style="flex:1"><h3>Foto da semana d${S.perfil.nome ? 'e ' + esc(S.perfil.nome) : 'o bebê'}</h3><div class="small muted">${fotos.length ? 'Já faz ' + Math.floor((Date.now() - ult.ts) / 864e5) + ' dias da última foto. Vamos registrar esta semana?' : 'Comece o álbum de evolução hoje. Uma foto por semana!'}</div></div><span class="go">›</span></a>`;
  } else {
    limparURLs(); const ult3 = fotos.slice(-4).reverse();
    box.innerHTML = `<div class="sec" style="margin-top:4px"><h3>Álbum de evolução</h3><a href="#album">Ver tudo</a></div><div class="fstrip">${ult3.map(f => `<a href="#foto/${f.id}"><img src="${urlDe(f)}" alt=""><span>${esc(idadeNaFoto(f.ts).curto)}</span></a>`).join('')}</div>`;
  }
};

window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#evolucao')) { const e = $('#evo'); if (e) { clearInterval(evoIv); e.remove(); document.body.style.overflow = ''; } } });
applyTheme(); render(); updMini();
